[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hcd-stamp-device"
version = "0.1.0"
description = "岡山大学ホームカミングデー・デジタルスタンプラリーのスタンプ機制御ソフト"
requires-python = ">=3.12"
dependencies = [
  "opencv-python-headless>=4.10,<5",
  "Pillow>=10,<12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
hcd-stamp-device = "hcd_stamp_device.main:main"

[tool.setuptools.packages.find]
include = ["hcd_stamp_device*"]

[tool.setuptools.package-data]
hcd_stamp_device = ["assets/fonts/*.ttf", "assets/fonts/*.txt", "assets/stamps/*.png"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["tests/"]
