# このファイルを /etc/hcd-stamp-device/config.toml にコピーして値を設定します。
# APIキーは設定ファイルにのみ保存し、Gitへは追加しません。

[server]
base_url = "https://example.invalid"
api_key = "replace-with-device-api-key"

[device]
id = "dev-01"
spot_id = "spot-01"

[storage]
queue_file = "/var/lib/hcd-stamp-device/pending-stamps.json"

[hardware]
# auto: Pi用ライブラリが見つかれば実機（カメラを開けなければ異常終了）、なければダミー。
# dummy: 開発PC用。pi: 実機を必須にする。
backend = "auto"
